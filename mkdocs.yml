site_name: RIP Bozotendo
site_description: Console guides, notes, and assorted modding knowledge.
site_url: https://megalonvii.github.io/RIP-Bozotendo/

nav:
  - Home: index.md
  - 3DS: 3ds/index.md
  - Steam Deck: steam-deck/index.md
  - Wii: wii/index.md

theme:
  name: material
  variant: classic
  language: en
  logo: assets/cloud think.png
  favicon: assets/cloud think.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: slate
      primary: green
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - sane_lists
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
